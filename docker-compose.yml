services:
  postgres:
    image: postgres:16-alpine
    container_name: nail-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nail_saas
    ports:
      - "5432:5432"
    volumes:
      - nail_saas_pg_data:/var/lib/postgresql/data

volumes:
  nail_saas_pg_data:
